<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="2.305317324185249 0.48 45.04974271012007 31.968000000000004" style="max-height: 500px" width="45.04974271012007" height="31.968000000000004">
  <defs>
    <filter height="1.6944" width="1.403" y="-.28472" x="-.20655">
      <feGaussianBlur stdDeviation="3" in="SourceAlpha"/>
      <feOffset result="offsetblur" dy="4" dx="0"/>
      <feComponentTransfer>
        <feFuncA type="linear"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style type="text/css">
      
      /*
** CLOUDS
*/
      @keyframes am-weather-cloud-2 {
        0% {
          -webkit-transform: translate(0px, 0px);
          -moz-transform: translate(0px, 0px);
          -ms-transform: translate(0px, 0px);
          transform: translate(0px, 0px);
        }

        50% {
          -webkit-transform: translate(2px, 0px);
          -moz-transform: translate(2px, 0px);
          -ms-transform: translate(2px, 0px);
          transform: translate(2px, 0px);
        }

        100% {
          -webkit-transform: translate(0px, 0px);
          -moz-transform: translate(0px, 0px);
          -ms-transform: translate(0px, 0px);
          transform: translate(0px, 0px);
        }
      }

      .am-weather-cloud-2 {
        -webkit-animation-name: am-weather-cloud-2;
        -moz-animation-name: am-weather-cloud-2;
        animation-name: am-weather-cloud-2;
        -webkit-animation-duration: 3s;
        -moz-animation-duration: 3s;
        animation-duration: 3s;
        -webkit-animation-timing-function: linear;
        -moz-animation-timing-function: linear;
        animation-timing-function: linear;
        -webkit-animation-iteration-count: infinite;
        -moz-animation-iteration-count: infinite;
        animation-iteration-count: infinite;
      }

      /*
** SUN
*/
      @keyframes am-weather-sun {
        0% {
          -webkit-transform: rotate(0deg);
          -moz-transform: rotate(0deg);
          -ms-transform: rotate(0deg);
          transform: rotate(0deg);
        }

        100% {
          -webkit-transform: rotate(360deg);
          -moz-transform: rotate(360deg);
          -ms-transform: rotate(360deg);
          transform: rotate(360deg);
        }
      }

      .am-weather-sun {
        -webkit-animation-name: am-weather-sun;
        -moz-animation-name: am-weather-sun;
        -ms-animation-name: am-weather-sun;
        animation-name: am-weather-sun;
        -webkit-animation-duration: 9s;
        -moz-animation-duration: 9s;
        -ms-animation-duration: 9s;
        animation-duration: 9s;
        -webkit-animation-timing-function: linear;
        -moz-animation-timing-function: linear;
        -ms-animation-timing-function: linear;
        animation-timing-function: linear;
        -webkit-animation-iteration-count: infinite;
        -moz-animation-iteration-count: infinite;
        -ms-animation-iteration-count: infinite;
        animation-iteration-count: infinite;
      }

      @keyframes am-weather-sun-shiny {
        0% {
          stroke-dasharray: 3px 10px;
          stroke-dashoffset: 0px;
        }

        50% {
          stroke-dasharray: 0.1px 10px;
          stroke-dashoffset: -1px;
        }

        100% {
          stroke-dasharray: 3px 10px;
          stroke-dashoffset: 0px;
        }
      }

      .am-weather-sun-shiny line {
        -webkit-animation-name: am-weather-sun-shiny;
        -moz-animation-name: am-weather-sun-shiny;
        -ms-animation-name: am-weather-sun-shiny;
        animation-name: am-weather-sun-shiny;
        -webkit-animation-duration: 2s;
        -moz-animation-duration: 2s;
        -ms-animation-duration: 2s;
        animation-duration: 2s;
        -webkit-animation-timing-function: linear;
        -moz-animation-timing-function: linear;
        -ms-animation-timing-function: linear;
        animation-timing-function: linear;
        -webkit-animation-iteration-count: infinite;
        -moz-animation-iteration-count: infinite;
        -ms-animation-iteration-count: infinite;
        animation-iteration-count: infinite;
      }
      
    </style>
  </defs>
  <g filter="url(#blur)" transform="translate(16,-2)">
    <g transform="translate(0,16)">
      <g style="-moz-animation-duration:9s;-moz-animation-iteration-count:infinite;-moz-animation-name:am-weather-sun;-moz-animation-timing-function:linear;-ms-animation-duration:9s;-ms-animation-iteration-count:infinite;-ms-animation-name:am-weather-sun;-ms-animation-timing-function:linear;-webkit-animation-duration:9s;-webkit-animation-iteration-count:infinite;-webkit-animation-name:am-weather-sun;-webkit-animation-timing-function:linear" class="am-weather-sun">
        <line stroke-width="2" stroke-linecap="round" stroke="#ffa500" fill="none" y2="3" transform="translate(0,9)"/>
        <g transform="rotate(45)">
          <line stroke-width="2" stroke-linecap="round" stroke="#ffa500" fill="none" y2="3" transform="translate(0,9)"/>
        </g>
        <g transform="rotate(90)">
          <line stroke-width="2" stroke-linecap="round" stroke="#ffa500" fill="none" y2="3" transform="translate(0,9)"/>
        </g>
        <g transform="rotate(135)">
          <line stroke-width="2" stroke-linecap="round" stroke="#ffa500" fill="none" y2="3" transform="translate(0,9)"/>
        </g>
        <g transform="scale(-1)">
          <line stroke-width="2" stroke-linecap="round" stroke="#ffa500" fill="none" y2="3" transform="translate(0,9)"/>
        </g>
        <g transform="rotate(225)">
          <line stroke-width="2" stroke-linecap="round" stroke="#ffa500" fill="none" y2="3" transform="translate(0,9)"/>
        </g>
        <g transform="rotate(-90)">
          <line stroke-width="2" stroke-linecap="round" stroke="#ffa500" fill="none" y2="3" transform="translate(0,9)"/>
        </g>
        <g transform="rotate(-45)">
          <line stroke-width="2" stroke-linecap="round" stroke="#ffa500" fill="none" y2="3" transform="translate(0,9)"/>
        </g>
        <circle stroke-width="2" stroke="#ffa500" fill="#ffa500" r="5"/>
      </g>
    </g>
    <g style="-moz-animation-duration:3s;-moz-animation-iteration-count:infinite;-moz-animation-name:am-weather-cloud-2;-moz-animation-timing-function:linear;-webkit-animation-duration:3s;-webkit-animation-iteration-count:infinite;-webkit-animation-name:am-weather-cloud-2;-webkit-animation-timing-function:linear" class="am-weather-cloud-2">
      <path stroke-width="1.2" stroke-linejoin="round" stroke="#fff" fill="#c6deff" d="m47.7 35.4c0-4.6-3.7-8.2-8.2-8.2-1 0-1.9 0.2-2.8 0.5-0.3-3.4-3.1-6.2-6.6-6.2-3.7 0-6.7 3-6.7 6.7 0 0.8 0.2 1.6 0.4 2.3-0.3-0.1-0.7-0.1-1-0.1-3.7 0-6.7 3-6.7 6.7 0 3.6 2.9 6.6 6.5 6.7h17.2c4.4-0.5 7.9-4 7.9-8.4z" transform="translate(-20,-11)"/>
    </g>
  </g>
