        <polygon stroke-miterlimit="10" fill="#ffc04a" points="4 4 3.3 5.2 2.7 4 1.5 3.3 2.7 2.7 3.3 1.5 4 2.7 5.2 3.3"/>
      </g>
      <g style="-moz-animation-delay:5s;-moz-animation-duration:4s;-moz-animation-iteration-count:1;-moz-animation-name:am-weather-moon-star-2;-moz-animation-timing-function:linear;-ms-animation-delay:5s;-ms-animation-duration:4s;-ms-animation-iteration-count:1;-ms-animation-name:am-weather-moon-star-2;-ms-animation-timing-function:linear;-webkit-animation-delay:5s;-webkit-animation-duration:4s;-webkit-animation-iteration-count:1;-webkit-animation-name:am-weather-moon-star-2;-webkit-animation-timing-function:linear" class="am-weather-moon-star-2">
        <polygon stroke-miterlimit="10" fill="#ffc04a" points="4 4 3.3 5.2 2.7 4 1.5 3.3 2.7 2.7 3.3 1.5 4 2.7 5.2 3.3" transform="translate(20,10)"/>
      </g>
      <g style="-moz-animation-duration:6s;-moz-animation-iteration-count:infinite;-moz-animation-name:am-weather-moon;-moz-animation-timing-function:linear;-moz-transform-origin:12.5px 15.15px 0;-ms-animation-duration:6s;-ms-animation-iteration-count:infinite;-ms-animation-name:am-weather-moon;-ms-animation-timing-function:linear;-ms-transform-origin:12.5px 15.15px 0;-webkit-animation-duration:6s;-webkit-animation-iteration-count:infinite;-webkit-animation-name:am-weather-moon;-webkit-animation-timing-function:linear;-webkit-transform-origin:12.5px 15.15px 0" class="am-weather-moon">
        <path stroke-width="2" stroke-linejoin="round" stroke="#ffc04a" fill="#ffc04a" d="m14.5 13.2c0-3.7 2-6.9 5-8.7-1.5-0.9-3.2-1.3-5-1.3-5.5 0-10 4.5-10 10s4.5 10 10 10c1.8 0 3.5-0.5 5-1.3-3-1.7-5-5-5-8.7z"/>
      </g>
    </g>
    <g stroke-width="2" stroke-linecap="round" stroke="#c6deff" fill="none" transform="translate(-10,20)" class="am-weather-fog">
      <line stroke-dasharray="3, 5, 17, 5, 7" x2="37" x1="1" y2="0" y1="0" class="am-weather-fog-1"/>
      <line stroke-dasharray="11, 7, 15" x2="33" x1="9" y2="5" y1="5" class="am-weather-fog-2"/>
      <line stroke-dasharray="11, 7, 3, 5, 9" x2="40" x1="5" y2="10" y1="10" class="am-weather-fog-3"/>
      <line stroke-dasharray="13, 5, 9, 5, 3" x2="42" x1="7" y2="15" y1="15" class="am-weather-fog-4"/>
