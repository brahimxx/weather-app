<svg viewBox="6 3.2 49.48795727636848 30.8" version="1.1" xmlns="http://www.w3.org/2000/svg" style="max-height: 500px" width="49.48795727636848" height="30.8">
  <defs>
    <filter height="1.4997" width="1.403" y="-.21122" x="-.20655">
      <feGaussianBlur stdDeviation="3" in="SourceAlpha"/>
      <feOffset result="offsetblur" dy="4" dx="0"/>
      <feComponentTransfer>
        <feFuncA type="linear"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style type="text/css">
      
      /*
** MOON
*/
      @keyframes am-weather-moon {
        0% {
          -webkit-transform: rotate(0deg);
          -moz-transform: rotate(0deg);
          -ms-transform: rotate(0deg);
          transform: rotate(0deg);
        }

        50% {
          -webkit-transform: rotate(15deg);
          -moz-transform: rotate(15deg);
          -ms-transform: rotate(15deg);
          transform: rotate(15deg);
        }

        100% {
          -webkit-transform: rotate(0deg);
          -moz-transform: rotate(0deg);
          -ms-transform: rotate(0deg);
          transform: rotate(0deg);
        }
      }

      .am-weather-moon {
        -webkit-animation-name: am-weather-moon;
        -moz-animation-name: am-weather-moon;
        -ms-animation-name: am-weather-moon;
        animation-name: am-weather-moon;
        -webkit-animation-duration: 6s;
        -moz-animation-duration: 6s;
        -ms-animation-duration: 6s;
        animation-duration: 6s;
        -webkit-animation-timing-function: linear;
        -moz-animation-timing-function: linear;
        -ms-animation-timing-function: linear;
        animation-timing-function: linear;
        -webkit-animation-iteration-count: infinite;
        -moz-animation-iteration-count: infinite;
        -ms-animation-iteration-count: infinite;
        animation-iteration-count: infinite;
        -webkit-transform-origin: 12.5px 15.15px 0;
        /* TODO FF CENTER ISSUE */
        -moz-transform-origin: 12.5px 15.15px 0;
        /* TODO FF CENTER ISSUE */
        -ms-transform-origin: 12.5px 15.15px 0;
        /* TODO FF CENTER ISSUE */
        transform-origin: 12.5px 15.15px 0;
        /* TODO FF CENTER ISSUE */
      }

      @keyframes am-weather-moon-star-1 {
        0% {
          opacity: 0;
        }

        100% {
          opacity: 1;
        }
      }

      .am-weather-moon-star-1 {
        -webkit-animation-name: am-weather-moon-star-1;
        -moz-animation-name: am-weather-moon-star-1;
        -ms-animation-name: am-weather-moon-star-1;
        animation-name: am-weather-moon-star-1;
        -webkit-animation-delay: 3s;
        -moz-animation-delay: 3s;
        -ms-animation-delay: 3s;
        animation-delay: 3s;
        -webkit-animation-duration: 5s;
        -moz-animation-duration: 5s;
        -ms-animation-duration: 5s;
        animation-duration: 5s;
        -webkit-animation-timing-function: linear;
        -moz-animation-timing-function: linear;
        -ms-animation-timing-function: linear;
        animation-timing-function: linear;
        -webkit-animation-iteration-count: 1;
        -moz-animation-iteration-count: 1;
        -ms-animation-iteration-count: 1;
        animation-iteration-count: 1;
      }

      @keyframes am-weather-moon-star-2 {
        0% {
          opacity: 0;
        }

        100% {
          opacity: 1;
        }
      }

      .am-weather-moon-star-2 {
        -webkit-animation-name: am-weather-moon-star-2;
        -moz-animation-name: am-weather-moon-star-2;
        -ms-animation-name: am-weather-moon-star-2;
        animation-name: am-weather-moon-star-2;
        -webkit-animation-delay: 5s;
        -moz-animation-delay: 5s;
        -ms-animation-delay: 5s;
        animation-delay: 5s;
        -webkit-animation-duration: 4s;
        -moz-animation-duration: 4s;
        -ms-animation-duration: 4s;
