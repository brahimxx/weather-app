<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="5.475128644939965 15.84 46.77873070325901 19.584" style="max-height: 500px" width="46.77873070325901" height="19.584">
  <defs>
    <filter height="1.4997" width="1.403" y="-.21122" x="-.20655">
      <feGaussianBlur stdDeviation="3" in="SourceAlpha"/>
      <feOffset result="offsetblur" dy="4" dx="0"/>
      <feComponentTransfer>
        <feFuncA type="linear"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style type="text/css">
      
      /*
** FOG
*/
      @keyframes am-weather-fog-1 {
        0% {
          transform: translate(0px, 0px)
        }

        50% {
          transform: translate(7px, 0px)
        }

        100% {
          transform: translate(0px, 0px)
        }
      }

      .am-weather-fog-1 {
        -webkit-animation-name: am-weather-fog-1;
        -moz-animation-name: am-weather-fog-1;
        -ms-animation-name: am-weather-fog-1;
        animation-name: am-weather-fog-1;
        -webkit-animation-duration: 8s;
        -moz-animation-duration: 8s;
        -ms-animation-duration: 8s;
        animation-duration: 8s;
        -webkit-animation-timing-function: linear;
        -moz-animation-timing-function: linear;
        -ms-animation-timing-function: linear;
        animation-timing-function: linear;
        -webkit-animation-iteration-count: infinite;
        -moz-animation-iteration-count: infinite;
        -ms-animation-iteration-count: infinite;
        animation-iteration-count: infinite;
      }

      @keyframes am-weather-fog-2 {
        0% {
          transform: translate(0px, 0px)
        }

        21.05% {
          transform: translate(-6px, 0px)
        }

        78.95% {
          transform: translate(9px, 0px)
        }

        100% {
          transform: translate(0px, 0px)
        }
      }

      .am-weather-fog-2 {
        -webkit-animation-name: am-weather-fog-2;
        -moz-animation-name: am-weather-fog-2;
        -ms-animation-name: am-weather-fog-2;
        animation-name: am-weather-fog-2;
        -webkit-animation-duration: 20s;
        -moz-animation-duration: 20s;
        -ms-animation-duration: 20s;
        animation-duration: 20s;
        -webkit-animation-timing-function: linear;
        -moz-animation-timing-function: linear;
        -ms-animation-timing-function: linear;
        animation-timing-function: linear;
        -webkit-animation-iteration-count: infinite;
        -moz-animation-iteration-count: infinite;
        -ms-animation-iteration-count: infinite;
        animation-iteration-count: infinite;
      }

      @keyframes am-weather-fog-3 {
        0% {
          transform: translate(0px, 0px)
        }

        25% {
          transform: translate(4px, 0px)
        }

        75% {
          transform: translate(-4px, 0px)
        }

        100% {
          transform: translate(0px, 0px)
        }
      }

      .am-weather-fog-3 {
        -webkit-animation-name: am-weather-fog-3;
        -moz-animation-name: am-weather-fog-3;
        -ms-animation-name: am-weather-fog-3;
        animation-name: am-weather-fog-3;
        -webkit-animation-duration: 6s;
        -moz-animation-duration: 6s;
        -ms-animation-duration: 6s;
        animation-duration: 6s;
        -webkit-animation-timing-function: linear;
        -moz-animation-timing-function: linear;
        -ms-animation-timing-function: linear;
        animation-timing-function: linear;
        -webkit-animation-iteration-count: infinite;
        -moz-animation-iteration-count: infinite;
        -ms-animation-iteration-count: infinite;
        animation-iteration-count: infinite;
      }

      @keyframes am-weather-fog-4 {
        0% {
          transform: translate(0px, 0px)
        }

        50% {
          transform: translate(-4px, 0px)
        }

        100% {
          transform: translate(0px, 0px)
        }
      }

      .am-weather-fog-4 {
        -webkit-animation-name: am-weather-fog-4;
        -moz-animation-name: am-weather-fog-4;
        -ms-animation-name: am-weather-fog-4;
        animation-name: am-weather-fog-4;
        -webkit-animation-duration: 6s;
        -moz-animation-duration: 6s;
        -ms-animation-duration: 6s;
        animation-duration: 6s;
        -webkit-animation-timing-function: linear;
        -moz-animation-timing-function: linear;
        -ms-animation-timing-function: linear;
        animation-timing-function: linear;
        -webkit-animation-iteration-count: infinite;
        -moz-animation-iteration-count: infinite;
        -ms-animation-iteration-count: infinite;
        animation-iteration-count: infinite;
      }
      
    </style>
  </defs>
  <g filter="url(#blur)" transform="translate(16,-2)">
    <g stroke-width="2" stroke-linecap="round" stroke="#c6deff" fill="none" transform="translate(-10,20)" class="am-weather-fog">
      <line stroke-dasharray="3, 5, 17, 5, 7" x2="37" x1="1" y2="0" y1="0" class="am-weather-fog-1"/>
      <line stroke-dasharray="11, 7, 15" x2="33" x1="9" y2="5" y1="5" class="am-weather-fog-2"/>
      <line stroke-dasharray="11, 7, 3, 5, 9" x2="40" x1="5" y2="10" y1="10" class="am-weather-fog-3"/>
      <line stroke-dasharray="13, 5, 9, 5, 3" x2="42" x1="7" y2="15" y1="15" class="am-weather-fog-4"/>
    </g>
  </g>
</svg>